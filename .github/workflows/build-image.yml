name: Build image

# Volt runs this fork rather than upstream: game_engine sends a `download` flag
# (game_engine/src/services/hltv/mod.rs) that only this fork implements, so the
# sidecar has to be built from here.
#
# The fork's default branch is master, not main.
#
# The image is pulled by the scraper on the VPS (volt-server deploy/vps,
# `sudo /opt/volt-scraper/update.sh`); Dokploy is gone, so there is no deploy
# step here.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/voltgame/flaresolverr

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/amd64 only: the VPS is x86_64 and the multi-arch build in
          # release-docker.yml (QEMU) takes far longer than this needs to.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
